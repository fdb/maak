# Checks the live site every 30 minutes. GitHub mails the repository owner when a run fails.
# GitHub pauses scheduled workflows in a repository without commits for 60 days.
name: Uptime

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/smoke.mjs https://maak.io
